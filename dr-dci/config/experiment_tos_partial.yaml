# DR-DCI Part 6 — 약관 청크 인덱스 증강 4조건 (회의 0804 실험 2)
#   python run_experiment.py --part 6 --config config/experiment_tos.yaml
#
# 데이터: data/raw/shinhan-tos/ (parsed_md 23문서 → 4,242청크, 질의 490)
#   - 준비: scripts/build_tos_corpus.py, build_tos_qa_*.py (QA), gate_tos_qa.py
#   - 증강: scripts/build_tos_metadata.py (규칙, LLM 0회)
#           scripts/build_tos_tags.py (claude CLI haiku, 재개 가능)
# 실행 요건: 임베딩 endpoint(8101)만 필요 — agent/judge/reranker 불요.
#   로컬: python scripts/serve_embeddings.py --port 8101

seed: 42

models:
  agent_llm:
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 2048

  embedding:
    # 신한 실험(experiment_shinhan.yaml)과 동일 모델 — 점수 비교 가능 조건.
    # KT Cloud vLLM(8101)과 로컬 serve_embeddings.py가 같은 인터페이스를 제공한다.
    url: "http://localhost:8101/v1/embeddings"
    name: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
    dimension: 1536

  reranker:
    url: "http://localhost:8002/v1/rerank"
    name: "BAAI/bge-reranker-v2-m3"

  judge_llm:
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 512

agent:
  max_turns: 10
  pull_top_k: 20
  max_pull_top_k: 200
  # part6 rank_all의 hybrid fusion에서 BM25 후보가 within_doc 필터 뒤에도
  # 남도록 넉넉히 잡는다 (전역 top-20이면 소형 문서 청크가 다 걸러진다)
  bm25_top_k: 1000
  rrf_k: 60
  workspace_max_docs: 100
  min_pulls: 2
  taxonomy_bonus: 0.15
  pull_reranker: false
  dci_tools: ["grep", "find", "read", "filter"]

hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  fusion: "rrf"
  rerank_top_k: 20

datasets:
  shinhan-tos:
    # parsed_md 23문서(약관 8·사업방법서 6·공시 3·코드형 3·기타 3) → 4,242청크
    # 질의 490 (정답셋 359 기반 증강 + 신규, gold=청크 1건)
    queries: 490

parts:
  part6_chunk_conditions:
    dataset: "shinhan-tos"
    subset: null            # 전체 코퍼스 (4,242청크 — 서브셋 기계 미사용)
    backends: ["dense", "hybrid_rrf"]   # 벡터 / BM25+벡터 하이브리드
    min_aug_coverage: 0.95
    aug_paths:
      metadata: "data/metadata/shinhan-tos_chunk.json"
      tags: "data/tags/shinhan-tos_chunk.json"
    conditions:
      - name: "baseline"
        description: "기본 검색 — 인덱스 = title+text"
      - name: "metadata_only"
        description: "청크 메타데이터를 인덱스 텍스트에 직렬화"
        index_metadata: true

evaluation:
  metrics: ["recall_at_1", "recall_at_3", "recall_at_5", "recall_at_10", "recall_at_20", "mrr", "ndcg_at_10"]
  judge_prompt_path: "config/judge_prompt.txt"

