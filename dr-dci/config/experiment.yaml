# DR-DCI Augmentation Experiment Config

# Analysis-only seed for paired bootstrap calculations. It is
# not forwarded to an LLM generation request.
seed: 42

# Existing local snapshots predate provenance capture. These source IDs and
# splits are recorded; their immutable HF revisions must be supplied before a
# new shared benchmark result is treated as externally reproducible.
data_provenance:
  trec-covid:
    corpus:
      dataset: "BeIR/trec-covid"
      subset: "corpus"
      split: "corpus"
      revision: null
    queries:
      dataset: "BeIR/trec-covid"
      subset: "queries"
      split: "queries"
      revision: null
    qrels:
      dataset: "BeIR/trec-covid-qrels"
      subset: null
      split: "test"
      revision: null
    revision_status: "not_recorded_in_existing_local_snapshot"

# Model endpoints (H200 server)
models:
  agent_llm:
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 2048
    # Optional generation seed. This is distinct from the analysis bootstrap seed.
    seed: null

  embedding:
    url: "http://localhost:8101/v1/embeddings"
    name: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
    dimension: 1536

  reranker:
    url: "http://localhost:8002/v1/rerank"
    name: "BAAI/bge-reranker-v2-m3"

  judge_llm:
    # OpenAI API
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 512
    # Optional generation seed. This is distinct from the analysis bootstrap seed.
    seed: null

# DR-DCI agent settings
agent:
  max_turns: 10
  pull_top_k: 20
  taxonomy_boost: 1.5
  bm25_top_k: 20
  rrf_k: 60
  workspace_max_docs: 100
  dci_tools: ["grep", "find", "read", "filter"]

# Hybrid RAG baseline settings
hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  fusion: "rrf"  # reciprocal rank fusion
  rerank_top_k: 20

# Datasets
datasets:
  trec-covid:
    subsets: [20000, 50000, 110000]
    queries: 50
  fiqa:
    queries: 50
  ko-strategyqa:
    queries: 50

# Experiment parts
parts:
  part1_stacking:
    dataset: "trec-covid"
    subset: 20000
    # Absolute macro workspace-document recall delta required for a positive
    # focused-screening signal; statistical significance alone is insufficient.
    # This is an internal provisional threshold, not a TREC or Shinhan standard.
    minimum_practical_effect_size: 0.01
    # Bump this identifier whenever the threshold definition or decision rule
    # changes; Part 2 accepts only a Part 1 result with the same criterion.
    minimum_practical_effect_version: "v1"
    # Set to "approved" together with the approval record before any focused
    # model-backed Part 1 or Part 2 run. The default protects against treating
    # an unapproved screening threshold as a pre-agreed operating criterion.
    minimum_practical_effect_status: "provisional_pending_approval"
    steps:
      # Baseline
      - name: "baseline"
        description: "DR-DCI raw (no augmentation)"
        taxonomy: false
        tags: false
        prefix: false
        metadata: false
      # 독립 효과
      - name: "taxonomy_only"
        description: "Taxonomy only"
        taxonomy: true
        tags: false
        prefix: false
        metadata: false
      - name: "tags_only"
        description: "Tags only"
        taxonomy: false
        tags: "A"
        prefix: false
        metadata: false
      - name: "prefix_only"
        description: "Prefix only"
        taxonomy: false
        tags: false
        prefix: true
        metadata: false
      - name: "metadata_only"
        description: "Metadata only"
        taxonomy: false
        tags: false
        prefix: false
        metadata: true
      # 적층
      - name: "stack_tax"
        description: "Stacked: +Taxonomy"
        taxonomy: true
        tags: false
        prefix: false
        metadata: false
      - name: "stack_tax_tags"
        description: "Stacked: +Taxonomy +Tags"
        taxonomy: true
        tags: "A"
        prefix: false
        metadata: false
      - name: "stack_tax_tags_prefix"
        description: "Stacked: +Taxonomy +Tags +Prefix"
        taxonomy: true
        tags: "A"
        prefix: true
        metadata: false
      - name: "stack_all"
        description: "Stacked: All augmentations"
        taxonomy: true
        tags: "A"
        prefix: true
        metadata: true

  part2_scaling:
    dataset: "trec-covid"
    methods: ["dr-dci-final", "hybrid-rag"]
    subsets: [20000, 50000, 110000]
    include_single_pull: true
    # Part 2 focused execution is blocked until a human-approved, positive
    # focused Part 1 result is provided with its immutable file hash.
    approved_part1_result:
      status: "pending"
      path: null
      sha256: null

  part3_tags:
    dataset: "trec-covid"
    subset: 20000
    approaches: ["A", "B", "C"]

  part4_generalization:
    datasets: ["fiqa", "ko-strategyqa"]
    methods: ["dr-dci-final", "hybrid-rag"]

  # Keep Peter's final augmentation stack fixed and change only the pull backend.
  part5_pull_backend:
    dataset: "trec-covid"
    subset: 20000
    backends: ["dense", "hybrid_rrf"]
    fixed_augmentations:
      taxonomy: true
      tags: "A"
      prefix: true
      metadata: true

# Evaluation
evaluation:
  # Current TREC-COVID endpoints are document-ID based. Shinhan chunk metrics
  # require a separate DocNav chunk/qrel evaluation contract.
  metrics: ["accuracy", "workspace_document_gold_recall", "efficiency", "degradation_rate"]
  judge_prompt_path: "config/judge_prompt.txt"
