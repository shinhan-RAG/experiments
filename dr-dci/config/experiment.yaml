# DR-DCI Augmentation Experiment Config

seed: 42

# Model endpoints (H200 server)
models:
  agent_llm:
    url: "http://localhost:8100/v1/chat/completions"
    name: "Qwen/Qwen3-8B"
    temperature: 0
    max_tokens: 2048

  embedding:
    url: "http://localhost:8101/v1/embeddings"
    name: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
    dimension: 1536

  reranker:
    url: "http://localhost:8002/v1/rerank"
    name: "BAAI/bge-reranker-v2-m3"

  judge_llm:
    # OpenAI API
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 512

# DR-DCI agent settings
agent:
  max_turns: 10
  pull_top_k: 20
  workspace_max_docs: 100
  dci_tools: ["grep", "find", "read", "filter"]

# Hybrid RAG baseline settings
hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  fusion: "rrf"  # reciprocal rank fusion
  rerank_top_k: 20

# Datasets
datasets:
  trec-covid:
    subsets: [20000, 50000, 110000]
    queries: 50
  fiqa:
    queries: 50
  ko-strategyqa:
    queries: 50

# Experiment parts
parts:
  part1_stacking:
    dataset: "trec-covid"
    subset: 20000
    steps:
      # Baseline
      - name: "baseline"
        description: "DR-DCI raw (no augmentation)"
        taxonomy: false
        tags: false
        prefix: false
        metadata: false
      # 독립 효과
      - name: "taxonomy_only"
        description: "Taxonomy only"
        taxonomy: true
        tags: false
        prefix: false
        metadata: false
      - name: "tags_only"
        description: "Tags only"
        taxonomy: false
        tags: "A"
        prefix: false
        metadata: false
      - name: "prefix_only"
        description: "Prefix only"
        taxonomy: false
        tags: false
        prefix: true
        metadata: false
      - name: "metadata_only"
        description: "Metadata only"
        taxonomy: false
        tags: false
        prefix: false
        metadata: true
      # 적층
      - name: "stack_tax"
        description: "Stacked: +Taxonomy"
        taxonomy: true
        tags: false
        prefix: false
        metadata: false
      - name: "stack_tax_tags"
        description: "Stacked: +Taxonomy +Tags"
        taxonomy: true
        tags: "A"
        prefix: false
        metadata: false
      - name: "stack_tax_tags_prefix"
        description: "Stacked: +Taxonomy +Tags +Prefix"
        taxonomy: true
        tags: "A"
        prefix: true
        metadata: false
      - name: "stack_all"
        description: "Stacked: All augmentations"
        taxonomy: true
        tags: "A"
        prefix: true
        metadata: true

  part2_scaling:
    dataset: "trec-covid"
    methods: ["dr-dci-final", "hybrid-rag"]
    subsets: [20000, 50000, 110000]

  part3_tags:
    dataset: "trec-covid"
    subset: 20000
    approaches: ["A", "B", "C"]

  part4_generalization:
    datasets: ["fiqa", "ko-strategyqa"]
    methods: ["dr-dci-final", "hybrid-rag"]

# Evaluation
evaluation:
  metrics: ["accuracy", "gold_recall_at_workspace", "efficiency", "degradation_rate"]
  judge_prompt_path: "config/judge_prompt.txt"
