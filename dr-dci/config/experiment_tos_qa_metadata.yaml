# QA-aligned semantic chunk metadata experiment (separate from earlier Part 6 runs).
# 1) python scripts/build_tos_qa_chunk_metadata_openai.py --workers 12
# 2) python run_experiment.py --part 6 --config config/experiment_tos_qa_metadata.yaml

seed: 42

models:
  agent_llm:
    url: "https://api.openai.com/v1/responses"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 2048
  embedding:
    url: "https://api.openai.com/v1/embeddings"
    name: "text-embedding-3-large"
    dimension: 3072
    batch_size: 32
  reranker:
    url: "http://localhost:8002/v1/rerank"
    name: "BAAI/bge-reranker-v2-m3"
  judge_llm:
    url: "https://api.openai.com/v1/responses"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 512

agent:
  max_turns: 10
  pull_top_k: 20
  max_pull_top_k: 200
  bm25_top_k: 1000
  rrf_k: 60
  workspace_max_docs: 100
  min_pulls: 2
  taxonomy_bonus: 0.15
  pull_reranker: false
  dci_tools: ["grep", "find", "read", "filter"]

hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  fusion: "rrf"
  rerank_top_k: 20

datasets:
  shinhan-tos:
    queries: 490

parts:
  part6_chunk_conditions:
    dataset: "shinhan-tos"
    hypothesis: "QA 표현 분포에 맞춘 청크 고유 메타데이터가 문서 내 검색 순위를 개선한다."
    subset: null
    backends: ["dense", "hybrid_rrf"]
    min_aug_coverage: 1.0
    baseline_hybrid_recall_at_5: 0.465
    comparison_report_path: "results/part6_qa_metadata/COMPARISON.md"
    augmentation_provenance:
      existing_chunk_metadata:
        generator: "scripts/build_tos_metadata.py"
        fields: "all existing fields"
      qa_semantic:
        generator: "scripts/build_tos_qa_chunk_metadata_openai.py"
        api: "OpenAI Responses API Structured Outputs"
        model: "gpt-4o-mini"
        qa_input_policy: "chunk-only generation; query-only exact-copy audit after generation"
        max_serialized_chars: 240
    aug_paths:
      existing_chunk_metadata: "data/metadata/shinhan-tos_chunk.json"
      qa_semantic: "data/metadata/shinhan-tos_qa_semantic.json"
    conditions:
      - name: "baseline"
        description: "title + chunk text only"
      - name: "existing_chunk_metadata"
        description: "earlier non-QA chunk metadata"
        index_metadata: true
        metadata_source: "existing_chunk_metadata"
      - name: "qa_facets"
        description: "semantic tags, targets, numbers, exclusions, keywords"
        index_metadata: true
        metadata_source: "qa_semantic"
        metadata_fields: ["시맨틱태그", "핵심대상", "수치조건", "제외제한", "검색키워드"]
        metadata_max_chars: 240
      - name: "qa_questions"
        description: "user-style query aliases only"
        index_metadata: true
        metadata_source: "qa_semantic"
        metadata_fields: ["질의별칭"]
        metadata_max_chars: 240
      - name: "qa_combined"
        description: "tags, numbers, exclusions, aliases, and keywords"
        index_metadata: true
        metadata_source: "qa_semantic"
        metadata_fields: ["시맨틱태그", "수치조건", "제외제한", "질의별칭", "검색키워드"]
        metadata_max_chars: 240

evaluation:
  metrics: ["recall_at_1", "recall_at_5", "recall_at_10", "recall_at_20", "mrr", "ndcg_at_10", "mean_gold_rank"]
  paired_bootstrap_iterations: 10000
  primary_metric: "hybrid_rrf.recall_at_5"
  judge_prompt_path: "config/judge_prompt.txt"

