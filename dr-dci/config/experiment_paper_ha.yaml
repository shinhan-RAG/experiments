# DR-DCI Augmentation Experiment Config — AI Hub 학술논문(HA, 인문학·예술체육학)
# config/experiment_shinhan.yaml 과 모델·에이전트 설정을 동일하게 두고 데이터셋만 교체한다.
#   python run_experiment.py --part 1 --config config/experiment_paper_ha.yaml
#   python run_experiment.py --part 3 --config config/experiment_paper_ha.yaml
#   python run_experiment.py --part 4 --config config/experiment_paper_ha.yaml
#
# 데이터: data/raw/paper-ha/  (331논문 → 4,253청크, 질의 50)
#   - parent_id 없는 청크 단위 corpus → 평가가 청크 단위다.
#     parent 단위 법률 데이터셋과 절대 점수를 직접 비교하면 안 된다.
#   - 요소 태그가 라벨에서 유래(결정론, approach_p): docs/PAPER_HA_TAG_RULES.md
#   - 준비: build_paper_ha_corpus.py / build_paper_ha_tags_p.py / build_paper_ha_qa.py
#           build_paper_ha_subset.py / build_shinhan_reference_answers.py --dataset paper-ha

seed: 42

# Model endpoints — 신한/법률과 동일하게 유지(조건 일치를 위해 바꾸지 말 것)
models:
  agent_llm:
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 2048

  embedding:
    url: "http://localhost:8101/v1/embeddings"
    name: "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
    dimension: 1536

  reranker:
    url: "http://localhost:8002/v1/rerank"
    name: "BAAI/bge-reranker-v2-m3"

  judge_llm:
    url: "https://api.openai.com/v1/chat/completions"
    name: "gpt-4o-mini"
    temperature: 0
    max_tokens: 512

agent:
  max_turns: 10
  pull_top_k: 20
  max_pull_top_k: 200
  bm25_top_k: 20
  rrf_k: 60
  workspace_max_docs: 100
  min_pulls: 2
  taxonomy_bonus: 0.15  # taxonomy soft boost 가산치 (CLI --taxonomy-bonus로 오버라이드)
  pull_reranker: false  # true면 DR-DCI pull 경로에도 리랭커 부착(hybrid와 패리티)
  dci_tools: ["grep", "find", "read", "filter"]

hybrid:
  dense_top_k: 20
  bm25_top_k: 20
  fusion: "rrf"
  rerank_top_k: 20

datasets:
  paper-ha:
    # AI Hub 학술논문 이해 데이터 Validation HA 331편 → 4,253청크(캡션 682 포함), 질의 50
    queries: 50

parts:
  part1_stacking:
    dataset: "paper-ha"
    # subset 은 반드시 non-null. 5000 -> size_key "5k" -> data/subsets/paper-ha/5k.json
    subset: 5000
    # tags: "P" = 라벨 유래 결정론 태그(approach_p, LLM 없음).
    # LLM 태그와의 비교는 Part 3에서 한다.
    steps:
      - name: "baseline"
        description: "DR-DCI raw (no augmentation)"
        taxonomy: false
        tags: false
        prefix: false
        metadata: false
      - name: "taxonomy_only"
        description: "Taxonomy only"
        taxonomy: true
        tags: false
        prefix: false
        metadata: false
      - name: "tags_only"
        description: "Tags only (deterministic P)"
        taxonomy: false
        tags: "P"
        prefix: false
        metadata: false
      - name: "prefix_only"
        description: "Prefix only"
        taxonomy: false
        tags: false
        prefix: true
        metadata: false
      - name: "metadata_only"
        description: "Metadata only"
        taxonomy: false
        tags: false
        prefix: false
        metadata: true
      - name: "stack_tax_tags"
        description: "Stacked: +Taxonomy +Tags"
        taxonomy: true
        tags: "P"
        prefix: false
        metadata: false
      - name: "stack_tax_tags_prefix"
        description: "Stacked: +Taxonomy +Tags +Prefix"
        taxonomy: true
        tags: "P"
        prefix: true
        metadata: false
      - name: "stack_all"
        description: "Stacked: All augmentations"
        taxonomy: true
        tags: "P"
        prefix: true
        metadata: true

  # part2_scaling: paper-ha 는 4,253청크로 규모 실험 최소 조건(20K)을 충족하지 못해 제외.

  part3_tags:
    dataset: "paper-ha"
    subset: 5000
    # P(라벨 결정론) vs A(의미역) vs B(질문유형) vs C(타입만).
    # A/B/C는 build_tags.py paper-ha --size=5000 으로 KT 클라우드(Qwen3-8B)에서 빌드.
    # 시간이 부족하면 approaches: ["P", "C"] 로 축소 가능(C가 가장 싸다).
    approaches: ["P", "A", "B", "C"]

  part4_generalization:
    methods: ["dr-dci-final", "hybrid-rag"]
    # 일반화 검증이므로 augmentation 없이 전체 코퍼스에서 DR-DCI vs Hybrid.
    datasets:
      - name: "paper-ha"
        subset: null
        augment: false
        queries: 50

evaluation:
  metrics: ["accuracy", "gold_recall_at_workspace", "efficiency", "degradation_rate"]
  judge_prompt_path: "config/judge_prompt.txt"
