# Academic-paper collection source configuration (element_alignment stage).
#
# The data root is intentionally NOT recorded here: it must be passed to the
# conversion CLI as --data-root. Archive paths are data-root relative and are
# pinned to the byte sizes and SHA-256 digests recorded by the accepted EDA
# inventory; any change fails the conversion loudly.
#
# HA/SS/ST are collections. Training/Validation are splits of each collection,
# never collections themselves.

schema_version: academic.collection-source-config.v1
dataset_name: aihub-academic-paper-understanding

namespace_policy:
  document: "{collection_id}::{json_stem}"
  element: "{collection_id}::{json_stem}::{paragraph_id}"
  chunk: "{collection_id}::{json_stem}::chunk::{chunk_index:04d}"
  image_reserved: "{collection_id}::{json_stem}::image::{image_id}"

content_field: "training_data_info.section_info[].original_text"
forbidden_content_fields:
  - summary_text
  - summary_cnt
  - original_cnt
  - procede
  - image_caption
  - image_category
  - location
  - page

