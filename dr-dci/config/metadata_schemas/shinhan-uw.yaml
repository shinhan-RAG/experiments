dataset: shinhan-uw
domain: korean_insurance_underwriting
description: "신한라이프 언더라이팅 실무문서 — 담보별 가입한도 · 보험권/기계약 합산한도 · 간편예외질환 Board · 메디컬 UW 가이드라인 · 건강진단기준 · 시행공문"

# scripts/build_metadata.build_json_schema 는 enum / integer / entities 세 형태만 처리한다.
# 그 외 타입(자유 문자열 등)은 프롬프트와 guided_json 양쪽에서 조용히 누락되므로 쓰지 않는다.
#
# 필드 이름은 scripts/build_shinhan_uw_corpus.build_parser_augmentations 가 만드는
# 결정론적 메타데이터(data/metadata/shinhan-uw-parser_4k.json)와 **같게 유지한다** —
# Part 1 의 metadata_only(LLM) arm 과 parser_meta_only(결정론적) arm 이 같은 필드로
# find() 필터를 쓸 수 있어야 두 arm 이 비교 가능하다.
fields:
  doc_type:
    type: enum
    description: "문서 종류"
    values:
      - limit_table        # 담보별·상품별 가입한도 표, 합산한도 표
      - simplified_board   # 간편예외질환 Board
      - medical_guide      # 메디컬 UW 가이드라인 (질환별 인수기준)
      - exam_standard      # 건강진단(무진단/종합진단) 기준
      - notice             # 시행공문 · 개정안내
      - other              # 위에 속하지 않음 (distractor 포함)

  element_type:
    type: enum
    description: "청크의 표현 형태. corpus.jsonl 의 element_type 과 같은 축이며 본문을 보고 재판정한다."
    values:
      - table
      - formula
      - figure
      - text

  uw_topic:
    type: enum
    description: "이 청크가 실제로 다루는 언더라이팅 주제 (해당 없으면 other)"
    nullable: true
    values:
      - issue_limit            # 담보별 가입한도 · 최소가입금액 · 지급비율
      - cross_contract_limit  # 기계약 합산 · 보험권 합산 한도
      - simplified_exception   # 간편예외질환 · 최소경과기간 · 합산 입원일수
      - disease_underwriting   # 질환별 가능/부담보/거절 · 심사 고려사항
      - health_exam            # 진단 기준금액 · 무진단플랜
      - channel_rule           # 채널 차등 · 유의FC · 보험업종사자
      - effective_notice       # 시행·종료·변경사항
      - other

  effective_year:
    type: integer
    description: "시행일 · 개정일 · 발행 연도 (판별 불가면 null)"
    range: [2015, 2027]
    nullable: true

  entities:
    type: list
    description: "청크의 핵심 개체"
    max_items: 5
    item_schema:
      name:
        type: string
        description: "개체명 (원문 표기 그대로)"
      category:
        type: enum
        values:
          - disease_code   # 질병분류코드 · 신한대표KCD (N90.0, C50 등)
          - rider_code     # 담보코드 (A100000 등)
          - rider_name     # 담보명 · 특약명
          - product_name   # 상품명
          - amount_limit   # 가입한도 · 금액 · 비율
          - date           # 일자 · 적용기간
          - organization   # 부서 · 채널 (언더라이팅심사팀, GA 등)
          - other
